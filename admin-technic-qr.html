<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>admin-technic QR</title>
<link rel="stylesheet" href="style.css">
<style>
.print-text {
  width: 100%;
  max-width: 420px;
  text-align: center;
  color: var(--teal-dark);
  font-weight: 700;
  font-size: 1.15rem;
  line-height: 1.5;
  margin: 0;
  white-space: pre-line;
}

.print-room-number {
  margin: 2px 0 0;
  font-size: 14px;
  line-height: 1.4;
  color: var(--muted);
  font-weight: 600;
  text-align: center;
}

.text-style-controls {
  width: 100%;
  max-width: 420px;
  margin: 0 auto 14px;
  text-align: right;
  display: grid;
  gap: 8px;
}

.text-style-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.text-style-row input,
.text-style-row select {
  padding: 8px;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-family: inherit;
}

@media print {
  @page { margin: 12mm; }

  body {
    background: #fff;
    padding: 0;
    min-height: auto;
  }

  body * {
    visibility: hidden !important;
  }

  #printArea,
  #printArea * {
    visibility: visible !important;
  }

  #printArea {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  #qrPrintWrap {
    border-color: #ddd !important;
    box-shadow: none !important;
  }
}
</style>
</head>
<body>

<div class="logo">
  <img src="alhourani.jpeg" alt="Al-Hourani Hospital Logo">
</div>

<div class="card" style="max-width:640px; text-align:center;">
  <h1>admin-technic QR</h1>
  <p class="subtitle" id="qrDomainText">جارِ تجهيز رابط الغرفة...</p>

  <div class="text-style-controls">
    <div class="label">تنسيق النص</div>
    <div class="text-style-row">
      <label for="textFontSize" class="label">الحجم</label>
      <input id="textFontSize" type="number" min="10" max="72" value="22" style="width:88px; text-align:center; direction:ltr;">

      <label for="textAlign" class="label">المحاذاة</label>
      <select id="textAlign" style="min-width:120px;">
        <option value="center" selected>وسط</option>
        <option value="right">يمين</option>
        <option value="left">يسار</option>
      </select>

      <label class="label" style="display:inline-flex; align-items:center; gap:5px; margin-inline-start:auto;">
        <input id="textBold" type="checkbox" checked>
        عريض
      </label>

      <label class="label" style="display:inline-flex; align-items:center; gap:5px;">
        <input id="textItalic" type="checkbox">
        مائل
      </label>
    </div>
  </div>

  <div id="printControls" style="width:100%; max-width:420px; margin:0 auto 14px; text-align:right;">
    <label for="textBeforeInput" class="label" style="display:block; margin-bottom:6px;">نص قبل الـ QR</label>
    <textarea id="textBeforeInput" rows="2" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); font-family:inherit; resize:vertical;"></textarea>
  </div>

  <div id="printArea">
    <p id="printTextBefore" class="print-text"></p>

    <div id="qrPrintWrap" style="position:relative; width:320px; height:320px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:14px;">
      <div id="qrCode" style="width:100%; height:100%;"></div>
      <img
        src="alhourani.jpeg"
        alt="Hospital Logo"
        style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:56px; height:56px; border-radius:10px; background:#fff; padding:5px; border:1px solid var(--line);"
      >
    </div>

    <p id="printRoomNumber" class="print-room-number"></p>

    <p id="printTextAfter" class="print-text"></p>
  </div>

  <div style="width:100%; max-width:420px; margin:14px auto 0; text-align:right;">
    <label for="textAfterInput" class="label" style="display:block; margin-bottom:6px;">نص بعد الـ QR</label>
    <textarea id="textAfterInput" rows="2" style="width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); font-family:inherit; resize:vertical;"></textarea>
  </div>

  <div style="margin-top:14px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
    <button id="printBtn" class="action-btn done-btn" style="min-width:140px;">طباعة</button>
    <button id="openDomainBtn" class="action-btn" style="min-width:140px;">فتح صفحة الغرفة</button>
  </div>

  <a href="admin-technic.html" style="display:block; margin-top:14px; text-decoration:none;">
    <button class="action-btn note-finish-btn" style="width:100%;">العودة إلى admin-technic</button>
  </a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module" src="admin-technic-qr.js"></script>

</body>
</html>
