<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>شكوى أو اقتراح</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="logo">
  <img src="alhourani.jpeg" alt="Al-Hourani Hospital Logo">
</div>

<div class="card" style="max-width:650px;">
  <h1>شكوى أو اقتراح للإدارة</h1>

  <p class="subtitle">
    يمكنك إرسال شكوى أو اقتراح وسيصل مباشرة إلى الإدارة.
  </p>

  <div class="request-meta" style="margin-bottom:16px;">
    رقم الغرفة:
    <strong id="roomNumber">--</strong>
  </div>

  <select id="feedbackType"
          style="width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);font-family:inherit;">
    <option value="complaint">شكوى</option>
    <option value="suggestion">اقتراح</option>
  </select>

  <input
    id="feedbackTitle"
    type="text"
    placeholder="عنوان الرسالة"
    style="width:100%;padding:14px;margin-top:14px;border-radius:12px;border:1px solid var(--line);font-family:inherit;"
  >

  <textarea
    id="feedbackMessage"
    placeholder="اكتب الشكوى أو الاقتراح هنا"
    style="width:100%;min-height:220px;padding:14px;margin-top:14px;border-radius:12px;border:1px solid var(--line);font-family:inherit;resize:vertical;"
  ></textarea>

  <button
    id="sendFeedbackBtn"
    class="action-btn"
    style="width:100%;margin-top:18px;">
    إرسال
  </button>

  <div
    id="successMsg"
    style="display:none;text-align:center;margin-top:16px;color:green;font-weight:700;">
    تم إرسال الرسالة بنجاح ✓
  </div>

</div>

<script type="module" src="feedback.js"></script>

</body>
</html>
