<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>لوحة الكافتيريا</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="banner" id="soundHint" style="display:none;">
  🔈 لتفعيل صوت التنبيه، اضغط بأي مكان بالشاشة مرة واحدة.
</div>

<div class="banner" id="notifyBanner" style="display:none;">
  تم تفعيل إشعارات المتصفح ✓ — ستصلك حتى لو التبويب في الخلفية، بشرط يبقى المتصفح مفتوحاً.
</div>

<div class="card">
  <a href="cafeteria-products.html" class="cafeteria-manage-link">
    إدارة المنتجات
  </a>
  <h1 style="margin:0;">لوحة الكافتيريا</h1>
  <p class="subtitle">الطلبات المباشرة من الغرف.</p>

  <div style="display:flex; gap:10px; width:100%; max-width:640px; flex-wrap:wrap; margin-bottom:10px; align-items:center;">
    <select id="alertModeSelect" class="alert-select">
      <option value="full">صوت واهتزاز</option>
      <option value="vibrate">اهتزاز فقط</option>
      <option value="off">إيقاف التنبيهات</option>
    </select>
    <button class="change-name" id="notifyBtn">تفعيل إشعارات المتصفح</button>
  </div>

  <div style="display:flex; gap:10px; width:100%; max-width:640px; flex-wrap:wrap; margin-bottom:14px;">
	<button id="tabCurrent" class="tab-btn active">الطلبات الحالية</button>
	<button id="tabDone" class="tab-btn">الطلبات المنتهية اليوم</button>
  </div>

  <div id="ordersList" style="width:100%; max-width:640px;"></div>

  <div id="ordersEmpty" class="empty-state" style="display:none; max-width:640px; padding:30px 20px;">
	لا توجد طلبات حالياً
  </div>
</div>

<script type="module" src="cafeteria.js"></script>

</body>
</html>
